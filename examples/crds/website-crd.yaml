apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.example.com
spec:
  group: example.com
  names:
    kind: Website
    plural: websites
    singular: website
    shortNames: ["ws"]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["domain", "replicas"]
              properties:
                domain:
                  type: string
                replicas:
                  type: integer
                tlsEnabled:
                  type: boolean
                phase:
                  type: string
                  enum: ["Pending", "Active", "Suspended"]
                port:
                  x-kubernetes-int-or-string: true
                template:
                  type: object
                  properties:
                    image:
                      type: string
                    env:
                      type: array
                      items:
                        type: object
                        required: ["name", "value"]
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
      subresources:
        status: {}
